services:
  db:
    image: mysql:8.0
    container_name: unistock_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: Unistock
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: unistock_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: unistock
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      # Nome do container, nao localhost: e como a api enxerga a Evolution API
      # de dentro da rede do compose (o valor do .env e pro host, ex. Postman).
      EVOLUTION_API_URL: http://evolution-api:8080
      # "api" precisa estar aqui pro Django aceitar a chamada do webhook: a
      # Evolution API chama http://api:8000/..., e com DEBUG=False o Django
      # rejeita com 400 (ALLOWED_HOSTS) qualquer Host que nao esteja na lista.
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,api

  worker:
    build: .
    container_name: unistock_worker
    restart: on-failure
    entrypoint: []
    command: celery -A backend worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0

  beat:
    build: .
    container_name: unistock_beat
    restart: on-failure
    entrypoint: []
    command: celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0

  # --- Bot de WhatsApp (Evolution API, nao-oficial) ---
  # Numero dedicado do bot: escaneia o QR code em http://localhost:3001
  # (evolution-manager) na primeira vez que subir. Nao usa a API oficial da
  # Meta — ver card "Conectar com zap" no Trello pro motivo da escolha.
  evolution-db:
    image: postgres:15
    container_name: unistock_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: unistock_evolution_api
    restart: unless-stopped
    depends_on:
      - evolution-db
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}@evolution-db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
    volumes:
      - evolution_instances:/evolution/instances

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: unistock_evolution_manager
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      # A imagem vem com um nginx.conf quebrado (gzip_proxied com valor
      # invalido "must-revalidate", trava em loop de restart). Sobrescreve
      # com uma versao corrigida ate a Evolution consertar isso upstream —
      # https://github.com/EvolutionAPI/evolution-api/issues/2093
      - ./docker/evolution-manager-nginx.conf:/etc/nginx/conf.d/nginx.conf:ro

volumes:
  mysql_data:
  evolution_pg_data:
  evolution_instances:
